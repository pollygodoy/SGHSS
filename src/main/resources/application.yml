spring:
  application:
    name: sghss
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    user:
      name: user
      password: password

# JWT Configuration
jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation12345
  expiration: 86400000 # 24 horas em milissegundos

server:
  port: 8080
  servlet:
    context-path: /api

# Documentação Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  api-docs-urls:
    swagger-ui: /api/v3/api-docs/swagger-ui.html

# Logging
logging:
  level:
    root: INFO
    com.vidaplus.sghss: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

